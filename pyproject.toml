[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "prueba-tecnica"
version = "0.1.0"
description = "Prueba técnica de modelos de machine learning"
requires-python = ">=3.9"
dependencies = [
    "jupyter",
    "sparky-bc",
    "impala-helper",
    "openpyxl",
    "training-pipeline-bc==0.1.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]